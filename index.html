const KEY='gsat-vocab-v14-full';const OLD_KEY='gsat-vocab-v13-full';let state={};try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==='object'&&!Array.isArray(saved))state=saved;else{const legacy=JSON.parse(localStorage.getItem(OLD_KEY));if(legacy&&typeof legacy==='object'&&!Array.isArray(legacy))state=JSON.parse(JSON.stringify(legacy));}}catch(e){}let onlyWrong=false,font=20,currentRound=null;let retryState={};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const get=k=>state[k]||{tries:0,done:false,firstWrong:false,chosen:[],message:'',shuffle:0,shown:false,writing:'',completed:false,attempts:[]};const complete=s=>!!(s.completed||s.shown);const active=k=>onlyWrong&&k.endsWith('-a')?(retryState[k]||(retryState[k]={tries:0,done:false,message:'',attempts:[]})):get(k);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){document.getElementById('end').textContent='無法儲存進度，請檢查瀏覽器儲存設定。'}}function sent(label,txt,style){return '<div class="sentence '+style+'"><div class="sentence-label">'+label+'</div><div class="en">'+txt+'</div></div>'}function orderFor(i,n,round=0){let a=Array.from({length:n},(_,j)=>j);for(let j=n-1;j>0;j--){let swap=(i*5+j*3+1+round*7)%(j+1);[a[j],a[swap]]=[a[swap],a[j]]}if(a.every((v,j)=>v===j)&&n>1)[a[0],a[1]]=[a[1],a[0]];return a}
function exercise(d,i,mode){
const k=i+'-'+mode,s=active(k);
if(onlyWrong&&!get(i+'-a').firstWrong)return '';
let part='';
if(mode==='a'){
const up=s.done?esc(d.up).replace('____','<strong>'+esc(d.answer)+'</strong>'):esc(d.up).replace('____','________');
part='<div class="stem-basic en">'+esc(d.basic)+'</div>'+sent('升級句',up,'upgrade')+'<div class="choices">'+orderFor(i,4,s.shuffle||0).map(j=>{let w=d.options[j],selected=(s.attempts||[]).some(a=>a.word===w);return '<button class="choice '+(selected?(w===d.answer?'selected':'incorrect'):'')+'" data-choice="'+k+'" data-word="'+esc(w)+'" '+(s.done?'disabled':'')+'>'+esc(w)+'</button>'}).join('')+'</div>';
}else{
part='<div class="stem-basic en">'+esc(d.basic2)+'</div><div class="write-target">目標字詞：'+esc(d.advanced)+'</div><div class="write-tip">可在腦中組句、口頭回答、寫在紙上或輸入英文；不強制輸入。</div><textarea class="write-area" data-writing="'+k+'" placeholder="自由練寫（非必填）">'+esc(s.writing||'')+'</textarea><div class="write-actions"><button class="action primary" data-show-answer="'+k+'">'+(s.shown?'隱藏參考答案':'查看參考答案')+'</button><button class="action" data-reset-writing="'+k+'">清除練寫</button></div>'+(s.shown?'<div class="write-answer"><b>參考答案</b><div class="en">'+esc(d.chunks.join(' '))+'</div><div class="write-tip">'+esc(d.note)+'</div></div>':'');
}
return '<div class="exercise"><div class="ex-title">'+(mode==='a'?'① 選擇進階字詞':'② 自主英文練寫')+'</div><div class="cn">'+esc(mode==='a'?d.cn:d.cn2)+'</div>'+part+(s.message?'<div class="feedback '+(s.message==='再試一次'?'retry':'')+'">'+esc(s.message)+'</div>':'')+(mode==='a'?'<div class="exercise-actions"><button class="action" data-reset-question="'+k+'">清除重做</button></div>':'')+'</div>';
}function render(){if(currentRound===null){renderHome();return;}const begin=currentRound*10,finish=begin+10;document.getElementById('home').hidden=true;document.getElementById('practice').hidden=false;document.getElementById('roundTitle').textContent='第 '+(currentRound+1)+' 回｜第 '+(begin+1)+'～'+finish+' 組';let out=DATA.map((d,i)=>{if(i<begin||i>=finish)return '';let a=exercise(d,i,'a'),b=exercise(d,i,'b');if(!a&&!b)return '';return '<section class="group"><div class="group-title">'+String(i+1).padStart(2,'0')+'｜'+esc(d.base)+(get(i+'-a').done?' → '+esc(d.advanced):' → ？')+'</div>'+a+b+(get(i+'-a').done&&complete(get(i+'-b'))?'<details><summary>字詞用法與常見搭配</summary><p>'+esc(d.note)+'</p><p><b>常見搭配：</b>'+esc(d.coll)+'</p></details>':'')+'</section>'}).join('');document.getElementById('list').innerHTML=out;let all=DATA.slice(begin,finish).flatMap((d,j)=>[get((begin+j)+'-a'),get((begin+j)+'-b')]),done=all.filter(s=>s.done||complete(s)).length,wrong=DATA.slice(begin,finish).filter((d,j)=>get((begin+j)+'-a').firstWrong).length;document.getElementById('status').textContent='已完成 '+done+' / 20 題';document.getElementById('remaining').textContent=onlyWrong?'首次錯題 '+wrong+' 題｜本次剩餘 '+Object.keys(retryState).filter(k=>retryState[k].done).length+' 題已重練':'首次錯題 '+wrong+' 題';document.getElementById('fill').style.width=done/20*100+'%';document.getElementById('end').textContent=onlyWrong&&!out?'目前沒有需要重練的題目。':done===20?'本回練習完成！':'';document.getElementById('retry').textContent=onlyWrong?'返回全部題目':'重練錯題'}function renderHome(){document.getElementById('home').hidden=false;document.getElementById('practice').hidden=true;document.getElementById('home').innerHTML='<div class="round-grid">'+Array.from({length:6},(_,r)=>{let done=0,wrong=0;for(let i=r*10;i<r*10+10;i++)for(let m of ['a','b']){let s=get(i+'-'+m);if(s.done||complete(s))done++;if(s.firstWrong)wrong++}return '<button class="round-card" data-round="'+r+'"><strong>第 '+(r+1)+' 回</strong><small>第 '+(r*10+1)+'～'+(r*10+10)+' 組｜完成 '+done+'/20 題｜待加強 '+wrong+' 題</small><div class="round-meter"><span style="width:'+(done/20*100)+'%"></span></div></button>'}).join('')+'</div>';}function update(k,s){state[k]=s;save();render()}function judge(k,word){let s=active(k);if(s.done)return;const d=DATA[Number(k.split('-')[0])],ok=word===d.answer;s.tries++;(s.attempts||(s.attempts=[])).push({word,ok});if(!ok&&!onlyWrong)s.firstWrong=true;if(ok){s.done=true;s.message='答對了！'}else if(s.tries===1){s.message='再試一次'}else{s.done=true;s.message='正確答案：'+d.answer}if(onlyWrong){retryState[k]=s;render()}else update(k,s)}
