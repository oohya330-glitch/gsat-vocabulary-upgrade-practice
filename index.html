w(begin,finish)+archiveNotice();document.getElementById('list').innerHTML=out;document.getElementById('pageLabel').textContent='第 '+(currentPage+1)+' / 2 頁｜第 '+(begin+currentPage*5+1)+'～'+(begin+currentPage*5+5)+' 組';document.getElementById('prevPage').disabled=currentPage===0;document.getElementById('nextPage').disabled=currentPage===1;if(typeof document.querySelectorAll==='function'){for(const n of document.querySelectorAll('details[data-detail]'))if(openDetails.includes(n.dataset.detail))n.open=true;if(focusKey){const replacement=Array.from(document.querySelectorAll('button,textarea')).find(n=>JSON.stringify(n.dataset)===focusKey);if(replacement)replacement.focus({preventScroll:true})}if(Number.isFinite(scrollY))window.scrollTo({top:scrollY});}let all=DATA.slice(begin,finish).flatMap((d,j)=>[get((begin+j)+'-a'),get((begin+j)+'-b')]),done=all.filter(s=>s.done||complete(s)).length,wrong=DATA.slice(begin,finish).filter((d,j)=>get((begin+j)+'-a').firstWrong).length;const retryDone=DATA.slice(begin,finish).filter((d,j)=>get((begin+j)+'-a').firstWrong&&get('_retry_'+(begin+j)+'-a').done).length;document.getElementById('status').textContent=onlyWrong?'已重練 '+retryDone+' / '+wrong+' 題':'已完成 '+done+' / 20 題';document.getElementById('remaining').textContent='首次錯題 '+wrong+' 題';document.getElementById('fill').style.width=(onlyWrong?(wrong?retryDone/wrong*100:0):done/20*100)+'%';document.getElementById('end').textContent=onlyWrong&&!hasExercises?'本頁沒有需要重練的題目。':done===20?'本回練習完成！':'';warning();document.getElementById('retry').textContent=onlyWrong?'返回全部題目':'錯題重練';document.getElementById('retry').disabled=!onlyWrong&&wrong===0;document.getElementById('retry').hidden=onlyWrong}function renderHome(){warning();document.getElementById('home').hidden=false;document.getElementById('practice').hidden=true;document.getElementById('home').innerHTML=archiveNotice()+'<div class="round-grid">'+Array.from({length:6},(_,r)=>{let done=0,wrong=0;for(let i=r*10;i<r*10+10;i++)for(let m of ['a','b']){let s=get(i+'-'+m);if(s.done||complete(s))done++;if(m==='a'&&s.firstWrong)wrong++}return '<button class="round-card" data-round="'+r+'"><strong>第 '+(r+1)+' 回</strong><small>第 '+(r*10+1)+'～'+(r*10+10)+' 組｜完成 '+done+'/20 題｜首次錯題 '+wrong+' 題</small><div class="round-meter"><span style="width:'+(done/20*100)+'%"></span></div></button>'}).join('')+'</div>';}function snapshotFor(k,s){const d=DATA[Number(k.split('-')[0])];s.questionId=d.questionId+(k.endsWith('-b')?'-b':'-a');s.contentRevision=d.contentRevision;s.snapshot={basic:d.basic,up:d.up,cn:d.cn,cn2:d.cn2,reference:d.chunks.join(' '),options:d.optionDetails.map(o=>({id:o.id,text:o.text})),answer:d.answer};return s}function update(k,s){state[k]=snapshotFor(k,s);save();render()}function judge(k,word){let s=active(k);if(s.done||conflictError||saveError)return;const d=DATA[Number(k.split('-')[0])];if(!d.options.includes(word))return;snapshotFor(k,s);const ok=word===d.answer;s.tries++;(s.attempts||(s.attempts=[])).push({word,optionId:d.optionDetails.find(o=>o.text===word).id,ok,recordedAt:new Date().toISOString()});if(!ok&&!onlyWrong)s.firstWrong=true;if(ok){s.done=true;s.message='答對了！'}else if(s.tries===1){s.message='再試一次'}else{s.done=true;s.message='正確答案：'+d.answer}if(onlyWrong){retryState[k]=s;state['_retry_'+k]={...s};save();render()}else update(k,s)}
let exportMarkup='',exportHeading='',exportWrongOnly=false;function updateNavigation(inExport){document.getElementById('studyNav').hidden=currentRound===null&&!inExport;document.getElementById('backRound').hidden=!(inExport||onlyWrong);}function closeExportPicker(){document.getElementById('exportTools').hidden=document.getElementById('exportView').hidden;document.getElementById('exportPicker').hidden=true;document.getElementById('openExport').setAttribute?.('aria-expanded','false');updateNavigation(!document.getElementById('exportView').hidden);}function openExportPicker(){if(currentRound===null)return;document.getElementById('exportTools').hidden=true;document.getElementById('exportPicker').hidden=false;document.getElementById('cancelExport').textContent=onlyWrong?'返回錯題頁':'返回本回練習';document.getElementById('openExport').setAttribute?.('aria-expanded','true');updateNavigation(true);}document.getElementById('openExport').onclick=()=>{if(document.getElementById('exportPicker').hidden)openExportPicker();else closeExportPicker();};document.getElementById('cancelExport').onclick=()=>{if(!document.getElementById('exportView').hidden){onlyWrong=false;savePrefs();render();window.scrollTo({top:0,behavior:'smooth'});}else{closeExportPicker();}};document.getElementById('changeExport').onclick=openExportPicker;
function reportGroup(d,i,record=state){const a=record[i+'-a']||{},b=record[i+'-b']||{};const attempts=(Array.isArray(a.attempts)?a.attempts:[]).map((v,j)=>'第 '+(j+1)+' 次：'+esc(v.word)+(v.ok?'（答對）':'（答錯）')).join('；')||'尚未作答';return '<article class="export-group"><h3>第 '+(i+1)+' 組｜'+esc(d.base)+' → '+esc(d.advanced)+'</h3><h4>① 選擇題</h4><p>'+esc(d.cn)+'</p><p class="en">'+esc(d.basic)+'</p><p class="en">'+esc(d.up)+'</p><p>選項：'+d.options.map(esc).join(' ／ ')+'</p><p>學生作答：'+attempts+'</p><p>答案：<b>'+esc(d.answer)+'</b></p><p class="en">'+esc(d.up.replace('____',d.answer))+'</p>'+learningAnalysis(d)+'<h4>② 自主英文練寫</h4><p>'+esc(d.cn2)+'</p><p>目標字詞：'+esc(d.advanced)+'</p><p>學生練寫：</p><div class="export-writing">'+esc(b.writing||'未輸入文字')+'</div><p>參考答案：</p><p class="en">'+esc(d.chunks.join(' '))+'</p></article>';}
function exportExercises(wrongOnly){if(currentRound===null)return '';exportWrongOnly=wrongOnly;closeExportPicker();document.getElementById('openExport').hidden=true;document.getElementById('resetTop').hidden=true;document.getElementById('exportWrong').setAttribute?.('aria-pressed',String(wrongOnly));document.getElementById('exportAll').setAttribute?.('aria-pressed',String(!wrongOnly));updateNavigation(true);const chosen=DATA.map((d,i)=>({d,i})).filter(({i})=>i>=currentRound*10&&i<currentRound*10+10&&(!wrongOnly||get(i+'-a').firstWrong));exportHeading='第 '+(currentRound+1)+' 回｜'+(wrongOnly?'本回錯題':'本回全部題目');exportMarkup='<h2>'+exportHeading+'</h2><p>學測英文作文｜字詞升級練習</p><p>'+chosen.length+' 組・'+chosen.length*2+' 題'+(wrongOnly?'（首次錯題及同組練寫）':'')+'｜'+esc(new Date().toLocaleDateString('zh-TW'))+'</p><p>此份含參考答案；練寫答案僅供參考。</p>'+(chosen.length?chosen.map(({d,i})=>reportGroup(d,i)).join(''):'<p>目前沒有首次答錯的題目。</p>');document.getElementById('exportContent').innerHTML=exportMarkup;document.getElementById('home').hidden=true;document.getElementById('practice').hidden=true;document.getElementById('exportView').hidden=false;document.getElementById('exportTools').hidden=false;window.scrollTo({top:0,behavior:'smooth'});return exportMarkup;}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-round')){currentRound=Number(b.dataset.round);currentPage=0;onlyWrong=false;retryState={};savePrefs();render();window.scrollTo({top:0,behavior:'smooth'});return}if(b.hasAttribute('data-reset-all')){resetAll();return}let w=b.dataset.showAnswer;if(w){if(conflictError||saveError)return;let s=get(w);s.shown=!s.shown;if(s.shown)s.completed=true;state[w]=snapshotFor(w,s);save();render();return}w=b.dataset.resetWriting;if(w){if(conflictError||saveError)return;let s=get(w);s.writing='';s.shown=false;state[w]=s;save();render();return}let k=b.dataset.resetQuestion;if(k){if(conflictError||saveError)return;if(onlyWrong){delete state['_retry_'+k];delete retryState[k]}else{const previous=get(k);state[k]={tries:0,done:false,firstWrong:false,chosen:[],message:'',shuffle:(previous.shuffle||0)+1,attempts:[]};delete state['_retry_'+k]}save();render();return}k=b.dataset.choice;if(k){judge(k,b.dataset.word);return}});function resetAll(){if(currentRound===null||conflictError||saveError)return;if(confirm('確定清除本回 20 題、首次錯題及本回重練歷史嗎？先前保留的紀錄不會刪除。')){for(let i=currentRound*10;i<currentRound*10+10;i++){delete state[i+'-a'];delete state[i+'-b'];delete state['_retry_'+i+'-a'];if(state._retryHistory)delete state._retryHistory[i+'-a']}onlyWrong=false;retryState={};savePrefs();save();render();window.scrollTo({top:0,behavior:'smooth'})}}document.getElementById('reset').onclick=resetAll;document.getElementById('resetTop').onclick=resetAll;function goHome(){currentRound=null;onlyWrong=false;retryState={};savePrefs();render();window.scrollTo({top:0,behavior:'smooth'})}document.getElementById('backHome').onclick=goHome;document.getElementById('backRound').onclick=()=>{if(currentRound===null){goHome();return;}onlyWrong=false;savePrefs();render();window.scrollTo({top:0,behavior:'smooth'});};function archiveCurrentRetries(){const history=state._retryHistory||(state._retryHistory={});for(let i=currentRound*10;i<currentRound*10+10;i++){const k=i+'-a',old=state['_retry_'+k];if(old){if((old.attempts||[]).length)(history[k]||(history[k]=[])).push({...old,runId:Date.now()+'-'+Math.random().toString(36).slice(2),recordedAt:new Date().toISOString()});delete state['_retry_'+k];}}retryState={};}
document.getElementById('prevPage').onclick=()=>changePage(0);document.getElementById('nextPage').onclick=()=>changePage(1);function changePage(page){if(currentRound===null||page===currentPage||page<0||page>1)return;currentPage=page;savePrefs();render();window.scrollTo({top:0,behavior:'smooth'});}document.getElementById('retry').onclick=()=>{if(currentRound===null)return;if(onlyWrong){onlyWrong=false;}else{if(conflictError||saveError||!DATA.slice(currentRound*10,currentRound*10+10).some((d,j)=>get((currentRound*10+j)+'-a').firstWrong))return;archiveCurrentRetries();onlyWrong=true;save();}savePrefs();render();window.scrollTo({top:0,behavior:'smooth'});};function markFontButton(id){for(const key of ['plus','minus']){document.getElementById(key).classList.toggle('tool-selected',key===id);document.getElementById(key).setAttribute?.('aria-pressed',String(key===id));}}document.getElementById('plus').onclick=()=>{markFontButton('plus');font=Math.min(font+1,28);document.documentElement.style.setProperty('--font',font+'px');savePrefs()};document.getElementById('minus').onclick=()=>{markFontButton('minus');font=Math.max(font-1,17);document.documentElement.style.setProperty('--font',font+'px');savePrefs()};document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('theme').textContent=document.body.classList.contains('dark')?'淺色模式':'深色模式';savePrefs()};window.addEventListener('storage',e=>{if(e.key===KEY||e.key===null){conflictError=true;warning()}});document.documentElement.style.setProperty('--font',font+'px');if(prefs.dark){document.body.classList.add('dark');document.getElementById('theme').textContent='淺色模式'}const backToTop=document.getElementById('backToTop');function updateBackToTop(){backToTop.hidden=window.scrollY<450;}window.addEventListener('scroll',updateBackToTop,{passive:true});backToTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto'
