<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>學測英文作文｜字詞升級練習 V9</title><style>
:root{--bg:#f5f3ef;--ink:#292929;--sub:#56534f;--line:#d9d5ce;--basic:#eae7e2;--upgrade:#dedbd5;--button:#fff;--accent:#575b55;--good:#2d6b51;--font:20px}body.dark{--bg:#242320;--ink:#f0ede7;--sub:#c7c1b7;--line:#4b4843;--basic:#35332f;--upgrade:#46423c;--button:#34322e;--accent:#d5c8b3;--good:#9ed8b7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif}main{max-width:850px;margin:auto;padding:18px 22px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tools{display:flex;gap:7px}button{cursor:pointer}.tool,.action{background:var(--button);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:15px}.eyebrow{font-size:13px;color:var(--sub)}h1{font-size:28px;margin:10px 0 6px}.subtitle{font-size:16px;color:var(--sub)}.progress{display:flex;justify-content:space-between;font-size:15px;margin:14px 0 7px}.bar{height:7px;background:var(--line);border-radius:6px;overflow:hidden}.fill{height:100%;background:var(--accent);width:0}.group{padding:13px 0 15px;border-bottom:1px solid var(--line)}.group-title{font-size:18px;font-weight:700;margin-bottom:8px}.exercise{margin-bottom:12px}.ex-title{font-size:17px;font-weight:500;margin-bottom:4px}.cn{font-size:20px;line-height:1.5;margin:2px 0}.en{font:var(--font)/1.6 Arial,sans-serif;overflow-wrap:anywhere}.stem-basic{color:var(--sub);margin:0 0 7px;line-height:1.45}.sentence{padding:8px 12px;border-radius:9px;margin:5px 0}.basic{background:var(--basic)}.upgrade,.build{background:var(--upgrade)}.sentence-label{font-size:17px;color:var(--sub);margin-bottom:2px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:7px}.choice,.chunk{border:1px solid var(--line);border-radius:9px;background:var(--button);color:var(--ink);font:19px Arial,sans-serif;padding:9px;min-height:44px}.choice:disabled,.chunk:disabled{opacity:.8;cursor:default}.build{min-height:48px;border-radius:9px;padding:8px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:7px}.placeholder{font-size:17px;color:var(--sub)}.pool{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0}.build .chunk{background:var(--basic)}.row-actions,.exercise-actions,.global-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:6px}.row-actions{flex-wrap:nowrap}.row-actions .action{flex:0 0 auto;white-space:nowrap}@media(max-width:560px){.row-actions{gap:5px}.row-actions .action{font-size:13px;padding:9px 7px}}.global-actions{margin-top:8px}.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}.feedback{font-size:16px;font-weight:600;color:var(--good);margin-top:5px}.feedback.retry{color:var(--sub)}details{margin-top:6px;font-size:19px;line-height:1.65}summary{cursor:pointer;color:var(--accent);font-weight:600}details p{margin:6px 0}.footer{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.end{font-size:17px;margin:15px 0;color:var(--sub)}@media(max-width:560px){main{padding:14px 14px 55px}h1{font-size:23px}.cn{font-size:21px}.group{padding:12px 0 14px}.sentence{padding:8px 10px}}
</style></head><body><main><div class="top"><div class="eyebrow">GSAT WRITING LAB</div><div class="tools"><button class="tool" id="minus">A−</button><button class="tool" id="plus">A+</button><button class="tool" id="theme">深色模式</button></div></div><h1>學測英文作文｜字詞升級練習</h1><div class="subtitle">常用字詞升級｜5 組・10 題</div><div class="progress"><span id="status"></span><span id="remaining"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="global-actions"><button class="action" data-reset-all>全部清除重做</button></div><div id="list"></div><div id="end" class="end"></div><div class="footer"><button class="action" id="retry">重練錯題</button><button class="action" id="reset">全部清除重做</button></div></main><script>
const DATA=[["big","significant","這個問題對青少年有很大的影響。","This issue has a big effect on teenagers.","This issue has a ____ effect on teenagers.","這項決定對我們的未來有重大影響。","This decision has a big impact on our future.","This decision|has a significant impact|on our future.","significant|numerous|harmful|essential","significant 強調影響、差異或重要性。","a significant impact / a significant difference"],["important","essential","充足的睡眠對健康很重要。","Enough sleep is important for good health.","Enough sleep is ____ for good health.","規律練習對提升英語能力很重要。","Regular practice is important for improving English skills.","Regular practice|is essential|for improving English skills.","beneficial|essential|numerous|harmful","essential 表示不可或缺，常接 to 或 for。","essential to success / essential for health"],["good","beneficial","規律運動對心理健康有益。","Regular exercise is good for mental health.","Regular exercise is ____ to mental health.","閱讀對學生的語言發展有益。","Reading is good for students’ language development.","Reading|is beneficial to|students’ language development.","harmful|numerous|beneficial|significant","beneficial 表示有益的，常搭配 be beneficial to。","beneficial to health / beneficial effects"],["bad","harmful","吸入污染空氣對健康有害。","Breathing polluted air is bad for our health.","Breathing polluted air is ____ to our health.","長時間久坐對身體有害。","Sitting for long periods is bad for the body.","Sitting for long periods|is harmful to|the body.","essential|harmful|beneficial|numerous","harmful 強調造成傷害，常搭配 be harmful to。","harmful to the environment / harmful effects"],["many","numerous","學生有許多機會學習新技能。","Students have many opportunities to learn new skills.","Students have ____ opportunities to learn new skills.","這個城市有許多公共圖書館。","This city has many public libraries.","This city|has numerous|public libraries.","significant|numerous|essential|beneficial","numerous 修飾可數複數名詞。","numerous opportunities / numerous reasons"]].map(x=>({base:x[0],advanced:x[1],cn:x[2],basic:x[3],up:x[4],cn2:x[5],basic2:x[6],chunks:x[7].split('|'),options:x[8].split('|'),note:x[9],coll:x[10]}));
const KEY='gsat-vocab-v9-demo';let state={};try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}let onlyWrong=false,font=20;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const get=k=>state[k]||{tries:0,done:false,firstWrong:false,chosen:[],message:'',shuffle:0};function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function sent(label,txt,style){return '<div class="sentence '+style+'"><div class="sentence-label">'+label+'</div><div class="en">'+txt+'</div></div>'}function orderFor(i,n,round=0){let a=Array.from({length:n},(_,j)=>j);for(let j=n-1;j>0;j--){let swap=(i*5+j*3+1+round*7)%(j+1);[a[j],a[swap]]=[a[swap],a[j]]}if(a.every((v,j)=>v===j)&&n>1)[a[0],a[1]]=[a[1],a[0]];return a}
function exercise(d,i,mode){const k=i+'-'+mode,s=get(k);if(onlyWrong&&!s.firstWrong)return '';const cn=mode==='a'?d.cn:d.cn2,basic=mode==='a'?d.basic:d.basic2,upgrade=mode==='a'?d.up:d.chunks.join(' '),upgraded=mode==='a'?(s.done?esc(upgrade).replace('____','<strong>'+esc(d.advanced)+'</strong>'):esc(upgrade).replace('____','________')):esc(upgrade).replace(esc(d.advanced),'<strong>'+esc(d.advanced)+'</strong>');let part='';if(mode==='a'){part='<div class="stem-basic en">'+esc(basic)+'</div>'+sent('升級句',upgraded,'upgrade')+'<div class="choices">'+d.options.map(w=>'<button class="choice" data-choice="'+k+'" data-word="'+esc(w)+'" '+(s.done?'disabled':'')+'>'+esc(w)+'</button>').join('')+'</div>'}else{part='<div class="build">'+(s.done?'<span class="en">'+upgraded+'</span>':s.chosen.length?s.chosen.map((n,j)=>'<button class="chunk" data-remove="'+k+'" data-index="'+j+'">'+esc(d.chunks[n])+' ×</button>').join(''):'<span class="placeholder">點選下方語塊，依序組成升級句。</span>')+'</div>';if(s.done){part+=sent('基本句',esc(basic),'basic')}else{part+='<div class="pool">'+orderFor(i,d.chunks.length,s.shuffle||0).map(j=>s.chosen.includes(j)?'':'<button class="chunk" data-add="'+k+'" data-index="'+j+'">'+esc(d.chunks[j])+'</button>').join('')+'</div>'}part+='<div class="row-actions"><button class="action" data-clear-selection="'+k+'" '+(s.done||!s.chosen.length?'disabled':'')+'>清除排列</button><button class="action primary" data-check="'+k+'" '+(s.done||s.chosen.length!==d.chunks.length?'disabled':'')+'>確認答案</button><button class="action" data-reset-question="'+k+'">清除重做</button></div>'}return '<div class="exercise"><div class="ex-title">'+(mode==='a'?'① 選擇進階字詞':'② 點選語塊組句')+'</div><div class="cn">'+esc(cn)+'</div>'+part+(s.message?'<div class="feedback '+(s.message==='再試一次'?'retry':'')+'">'+esc(s.message)+'</div>':'')+(mode==='a'?'<div class="exercise-actions"><button class="action" data-reset-question="'+k+'">清除重做</button></div>':'')+'</div>'}
function render(){let out=DATA.map((d,i)=>{let a=exercise(d,i,'a'),b=exercise(d,i,'b');if(!a&&!b)return '';return '<section class="group"><div class="group-title">'+String(i+1).padStart(2,'0')+'｜'+esc(d.base)+'｜進階表達</div>'+a+b+(get(i+'-a').done&&get(i+'-b').done?'<details><summary>字詞用法與常見搭配</summary><p>'+esc(d.note)+'</p><p><b>常見搭配：</b>'+esc(d.coll)+'</p></details>':'')+'</section>'}).join('');document.getElementById('list').innerHTML=out;let all=DATA.flatMap((d,i)=>[get(i+'-a'),get(i+'-b')]),done=all.filter(s=>s.done).length,wrong=all.filter(s=>s.firstWrong).length;document.getElementById('status').textContent='已完成 '+done+' / 10 題';document.getElementById('remaining').textContent='待加強 '+wrong+' 題';document.getElementById('fill').style.width=done*10+'%';document.getElementById('end').textContent=onlyWrong&&!out?'目前沒有需要重練的題目。':done===10?'本回練習完成！':'';document.getElementById('retry').textContent=onlyWrong?'返回全部題目':'重練錯題'}function update(k,s){state[k]=s;save();render()}function judge(k,ok){let s=get(k);if(s.done)return;s.tries++;if(!ok)s.firstWrong=true;if(ok){s.done=true;s.message='答對了！'}else if(s.tries===1){s.message='再試一次'}else{s.done=true;s.message='正確答案：'+(k.endsWith('-b')?DATA[Number(k.split('-')[0])].chunks.join(' '):DATA[Number(k.split('-')[0])].advanced)}update(k,s)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-reset-all')){resetAll();return}let k=b.dataset.resetQuestion;if(k){const previous=get(k);state[k]={tries:0,done:false,firstWrong:false,chosen:[],message:'',shuffle:(previous.shuffle||0)+1};save();render();return}k=b.dataset.choice;if(k){judge(k,b.dataset.word===DATA[Number(k.split('-')[0])].advanced);return}k=b.dataset.add;if(k){let s=get(k);if(s.done)return;s.chosen.push(Number(b.dataset.index));update(k,s);return}k=b.dataset.remove;if(k){let s=get(k);if(s.done)return;s.chosen.splice(Number(b.dataset.index),1);update(k,s);return}k=b.dataset.clearSelection;if(k){let s=get(k);if(s.done)return;s.chosen=[];update(k,s);return}k=b.dataset.check;if(k){let s=get(k),d=DATA[Number(k.split('-')[0])];if(s.done||s.chosen.length!==d.chunks.length)return;let ok=s.chosen.every((v,i)=>v===i);s.chosen=[];state[k]=s;judge(k,ok);return}});function resetAll(){if(confirm('確定要清除全部題目的作答紀錄並重新開始嗎？')){state={};onlyWrong=false;save();render();window.scrollTo({top:0,behavior:'smooth'})}}document.getElementById('reset').onclick=resetAll;document.getElementById('retry').onclick=()=>{onlyWrong=!onlyWrong;render();window.scrollTo({top:0,behavior:'smooth'})};document.getElementById('plus').onclick=()=>{font=Math.min(font+1,28);document.documentElement.style.setProperty('--font',font+'px')};document.getElementById('minus').onclick=()=>{font=Math.max(font-1,17);document.documentElement.style.setProperty('--font',font+'px')};document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('theme').textContent=document.body.classList.contains('dark')?'淺色模式':'深色模式'};render();
</script></body></html>
