const KEY='gsat-vocab-v12-full';let state={};try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}let onlyWrong=false,font=20,currentRound=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const get=k=>state[k]||{tries:0,done:false,firstWrong:false,chosen:[],message:'',shuffle:0};function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function sent(label,txt,style){return '<div class="sentence '+style+'"><div class="sentence-label">'+label+'</div><div class="en">'+txt+'</div></div>'}function orderFor(i,n,round=0){let a=Array.from({length:n},(_,j)=>j);for(let j=n-1;j>0;j--){let swap=(i*5+j*3+1+round*7)%(j+1);[a[j],a[swap]]=[a[swap],a[j]]}if(a.every((v,j)=>v===j)&&n>1)[a[0],a[1]]=[a[1],a[0]];return a}
function exercise(d,i,mode){const k=i+'-'+mode,s=get(k);if(onlyWrong&&!s.firstWrong)return '';const cn=mode==='a'?d.cn:d.cn2,basic=mode==='a'?d.basic:d.basic2,upgrade=mode==='a'?d.up:d.chunks.join(' '),upgraded=mode==='a'?(s.done?esc(upgrade).replace('____','<strong>'+esc(d.answer||d.advanced)+'</strong>'):esc(upgrade).replace('____','________')):esc(upgrade).replace(esc(d.advanced),'<strong>'+esc(d.advanced)+'</strong>');let part='';if(mode==='a'){part='<div class="stem-basic en">'+esc(basic)+'</div>'+sent('升級句',upgraded,'upgrade')+'<div class="choices">'+d.options.map(w=>'<button class="choice" data-choice="'+k+'" data-word="'+esc(w)+'" '+(s.done?'disabled':'')+'>'+esc(w)+'</button>').join('')+'</div>'}else{part='<div class="build">'+(s.done?'<span class="en">'+upgraded+'</span>':s.chosen.length?s.chosen.map((n,j)=>'<button class="chunk" data-remove="'+k+'" data-index="'+j+'">'+esc(d.chunks[n])+' ×</button>').join(''):'<span class="placeholder">點選下方語塊，依序組成升級句。</span>')+'</div>';if(s.done){part+=sent('基本句',esc(basic),'basic')}else{part+='<div class="pool">'+orderFor(i,d.chunks.length,s.shuffle||0).map(j=>s.chosen.includes(j)?'':'<button class="chunk" data-add="'+k+'" data-index="'+j+'">'+esc(d.chunks[j])+'</button>').join('')+'</div>'}part+='<div class="row-actions"><button class="action" data-clear-selection="'+k+'" '+(s.done||!s.chosen.length?'disabled':'')+'>清除排列</button><button class="action primary" data-check="'+k+'" '+(s.done||s.chosen.length!==d.chunks.length?'disabled':'')+'>確認答案</button><button class="action" data-reset-question="'+k+'">清除重做</button></div>'}return '<div class="exercise"><div class="ex-title">'+(mode==='a'?'① 選擇進階字詞':'② 點選語塊組句')+'</div><div class="cn">'+esc(cn)+'</div>'+part+(s.message?'<div class="feedback '+(s.message==='再試一次'?'retry':'')+'">'+esc(s.message)+'</div>':'')+(mode==='a'?'<div class="exercise-actions"><button class="action" data-reset-question="'+k+'">清除重做</button></div>':'')+'</div>'}
function render(){if(currentRound===null){renderHome();return;}const begin=currentRound*10,finish=begin+10;document.getElementById('home').hidden=true;document.getElementById('practice').hidden=false;document.getElementById('roundTitle').textContent='第 '+(currentRound+1)+' 回｜第 '+(begin+1)+'～'+finish+' 組';let out=DATA.map((d,i)=>{if(i<begin||i>=finish)return '';let a=exercise(d,i,'a'),b=exercise(d,i,'b');if(!a&&!b)return '';return '<section class="group"><div class="group-title">'+String(i+1).padStart(2,'0')+'｜'+esc(d.base)+' → '+esc(d.advanced)</div>'+a+b+(get(i+'-a').done&&get(i+'-b').done?'<details><summary>字詞用法與常見搭配</summary><p>'+esc(d.note)+'</p><p><b>常見搭配：</b>'+esc(d.coll)+'</p></details>':'')+'</section>'}).join('');document.getElementById('list').innerHTML=out;let all=DATA.slice(begin,finish).flatMap((d,j)=>[get((begin+j)+'-a'),get((begin+j)+'-b')]),done=all.filter(s=>s.done).length,wrong=all.filter(s=>s.firstWrong).length;document.getElementById('status').textContent='已完成 '+done+' / 20 題';document.getElementById('remaining').textContent='待加強 '+wrong+' 題';document.getElementById('fill').style.width=done/20*100+'%';document.getElementById('end').textContent=onlyWrong&&!out?'目前沒有需要重練的題目。':done===20?'本回練習完成！':'';document.getElementById('retry').textContent=onlyWrong?'返回全部題目':'重練錯題'}function renderHome(){document.getElementById('home').hidden=false;document.getElementById('practice').hidden=true;document.getElementById('home').innerHTML='<div class="round-grid">'+Array.from({length:6},(_,r)=>{let done=0,wrong=0;for(let i=r*10;i<r*10+10;i++)for(let m of ['a','b']){let s=get(i+'-'+m);if(s.done)done++;if(s.firstWrong)wrong++}return '<button class="round-card" data-round="'+r+'"><strong>第 '+(r+1)+' 回</strong><small>第 '+(r*10+1)+'～'+(r*10+10)+' 組｜完成 '+done+'/20 題｜待加強 '+wrong+' 題</small><div class="round-meter"><span style="width:'+(done/20*100)+'%"></span></div></button>'}).join('')+'</div>';}function update(k,s){state[k]=s;save();render()}function judge(k,ok){let s=get(k);if(s.done)return;s.tries++;if(!ok)s.firstWrong=true;if(ok){s.done=true;s.message='答對了！'}else if(s.tries===1){s.message='再試一次'}else{s.done=true;s.message='正確答案：'+(k.endsWith('-b')?DATA[Number(k.split('-')[0])].chunks.join(' '):(DATA[Number(k.split('-')[0])].answer||DATA[Number(k.split('-')[0])].advanced))}update(k,s)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-round')){currentRound=Number(b.dataset.round);onlyWrong=false;render();window.scrollTo({top:0,behavior:'smooth'});return}if(b.hasAttribute('data-reset-all')){resetAll();return}let k=b.dataset.resetQuestion;if(k){const previous=get(k);state[k]={tries:0,done:false,firstWrong:false,chosen:[],message:'',shuffle:(previous.shuffle||0)+1};save();render();return}k=b.dataset.choice;if(k){judge(k,b.dataset.word===(DATA[Number(k.split('-')[0])].answer||DATA[Number(k.split('-')[0])].advanced));return}k=b.dataset.add;if(k){let s=get(k);if(s.done)return;s.chosen.push(Number(b.dataset.index));update(k,s);return}k=b.dataset.remove;if(k){let s=get(k);if(s.done)return;s.chosen.splice(Number(b.dataset.index),1);update(k,s);return}k=b.dataset.clearSelection;if(k){let s=get(k);if(s.done)return;s.chosen=[];update(k,s);return}k=b.dataset.check;if(k){let s=get(k),d=DATA[Number(k.split('-')[0])];if(s.done||s.chosen.length!==d.chunks.length)return;let ok=s.chosen.every((v,i)=>v===i);s.chosen=[];state[k]=s;judge(k,ok);return}});function resetAll(){if(currentRound===null)return;if(confirm('確定要清除本回 20 題的作答紀錄嗎？')){for(let i=currentRound*10;i<currentRound*10+10;i++){delete state[i+'-a'];delete state[i+'-b']}onlyWrong=false;save();render();window.scrollTo({top:0,behavior:'smooth'})}}document.getElementById('reset').onclick=resetAll;function goHome(){currentRound=null;onlyWrong=false;render();window.scrollTo({top:0,behavior:'smooth'})}document.getElementById('backHome').onclick=goHome;document.getElementById('backBottom').onclick=goHome;document.getElementById('retry').onclick=()=>{onlyWrong=!onlyWrong;render();window.scrollTo({top:0,behavior:'smooth'})};document.getElementById('plus').onclick=()=>{font=Math.min(font+1,28);document.documentElement.style.setProperty('--font',font+'px')};document.getElementById('minus').onclick=()=>{font=Math.max(font-1,17);document.documentElement.style.setProperty('--font',font+'px')};document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('theme').textContent=document.body.classList.contains('dark')?'淺色模式':'深色模式'};render();
